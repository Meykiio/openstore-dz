name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests, dead code, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Dead code and unused dependencies
        run: npm run knip

      - name: Production build
        run: npm run build

  security:
    name: Dependency, secret and misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history matters: a secret committed and removed is still compromised.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The gitleaks Action is commercially licensed for organisation-owned
      # repos, so the CLI runs through Docker instead. Same scanner, no licence
      # dependency for anyone who forks this into an org.
      - name: Gitleaks
        run: docker run -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact

  accessibility:
    name: End-to-end and accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Real tests, not `--if-present`. The previous version of this job ran
      # `npm run a11y --if-present`, which silently succeeded because no such
      # script existed: a green check that verified nothing.
      #
      # These tests exercise live RLS and the place_order transaction, so they
      # need read/insert access to a project. They create orders named
      # `E2E-TEST`; delete them with the SQL in e2e/README.md.
      - name: Run Playwright
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
